name: gosec-upload-sarif

# 场景二：workflow 单独使用（GitHub Actions）
# 触发：手动 / push / PR / 定时
on:
  workflow_dispatch:
  push:
    branches: ["main"] # 换成业务仓默认分支名
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *" # 5 位 POSIX：每天 00:00 UTC（CST 08:00）

# OIDC 免密换证：GitHub 平台使用华为云 IAM 中注册的 GitHubActions 身份提供商，
# 无需配置任何 Secrets；id-token: write 缺失时上传步骤会报
# 「缺少 ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN 环境变量」
permissions:
  contents: read
  id-token: write

concurrency:
  group: gosec-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec-scan-upload:
    name: Gosec 扫描 - SARIF - 上传
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          # 取 max(go.mod 的 go 指令, gosec 要求的最低 Go)；gosec v2.30.0 要求 Go >= 1.26
          go-version: "1.26"
          # 超大仓库可改为 false，避免缓存保存阶段磁盘耗尽导致整条 run 失败
          cache: true

      # 安装与扫描放在同一步，避免 go install 的 PATH 修改无法跨 step 继承
      - name: 安装 gosec 并扫描
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -version
          mkdir -p reports
          gosec -no-fail -conf gosec.json -fmt sarif -out reports/gosec.sarif \
            -exclude-dir=vendor -exclude-generated ./...

      # 打印结果条数：0 条可能是确实无问题，也可能是包加载失败（结合日志 type errors 判断）
      - name: Check SARIF results
        if: ${{ always() }}
        run: |
          test -f reports/gosec.sarif || exit 0
          echo "gosec results: $(grep -o '"ruleId"' reports/gosec.sarif | wc -l)"

      - name: Upload SARIF to openLiBing
        if: ${{ always() }}
        uses: openlibing-test/upload-sarif-action@source-platform-detection
        with:
          sarif_file: reports/gosec.sarif
          source_path: .
          category: "business"
          env_type: beta   # openlibing-test 验证仓固定回传测试环境；业务仓默认 prod 可删此行

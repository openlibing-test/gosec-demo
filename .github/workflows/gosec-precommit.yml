name: gosec-precommit

# 场景一：pre-commit 集成（GitHub Actions）
# 触发：手动 / push / PR / 定时
on:
  workflow_dispatch:
  push:
    branches: ["main"] # 换成业务仓默认分支名
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *" # 5 位 POSIX：每天 00:00 UTC（CST 08:00）

# GitHub 上不使用 OIDC（华为云侧未信任 GitHub issuer），上传走 AK/SK 模式，仅需读仓库权限
permissions:
  contents: read

jobs:
  pre-commit-report:
    name: pre-commit-report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      # 安装到 .github/bin/，pre-commit hook 用固定路径（与 GitCode 的 .gitcode/bin/gosec 对称）
      - name: Install gosec
        run: |
          mkdir -p .github/bin /tmp/pre-commit-reports/
          GOBIN="$(pwd)/.github/bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          chmod +x .github/bin/gosec
          .github/bin/gosec -version

      - name: run pre-commit (generate sarif)
        id: pre-commit
        uses: openlibing-test/pre-commit-action@main
        with:
          extra_args: "--all-files"
          report-dir: /tmp/pre-commit-reports/

      # gosec 输出路径固定，upload 直接引用文件（勿依赖 sarif-files output，可能为空）
      - name: Verify SARIF report
        if: ${{ always() }}
        run: |
          ls -la /tmp/pre-commit-reports/ || true
          test -s /tmp/pre-commit-reports/gosec.sarif

      - name: upload sarif reports
        if: ${{ always() }}
        uses: openlibing-test/upload-sarif-action@main
        with:
          sarif_file: /tmp/pre-commit-reports/gosec.sarif
          source_path: .
          category: business
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
          # env_type: beta   # 需回传测试环境时取消注释（默认 prod）

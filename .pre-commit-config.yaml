# gosec pre-commit 钩子配置（GitHub 方案）
# 使用方式：复制到业务仓根目录，文件名保持 .pre-commit-config.yaml
# entry 固定指向 .github/bin/gosec，由 .github/workflows/gosec-precommit.yml
# 的「Install gosec」step 通过 GOBIN="$(pwd)/.github/bin" go install 安装
# 与 GitCode 版唯一差异：entry 路径（.gitcode/bin/gosec → .github/bin/gosec）
repos:
  # ===================== Go 语言 =====================
  # local hook：直接调 gosec，依赖本机 Go 工具链 + go install 安装的 gosec
  # - language: system：pre-commit 不创建隔离环境，直接执行 entry
  # - pass_filenames: false + ./...：模块级全量扫描；types: [go] 仅决定有 Go 文件变更时是否触发，不是增量
  # - Windows 本地验证时 entry 需指向 gosec.exe（pre-commit 不自动补全扩展名）
  # - require_serial：避免分批覆盖 SARIF 输出
  # - -fmt sarif + -out：直接生成 SARIF v2.1.0 到 pre-commit-action 约定的报告目录
  - repo: local
    hooks:
      - id: gosec
        name: gosec (sarif report)
        entry: .github/bin/gosec
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
        args:
          - -conf=gosec.json
          - -fmt=sarif
          - -out=/tmp/pre-commit-reports/gosec.sarif
          - -exclude-dir=vendor
          - -exclude-generated
          - ./...
